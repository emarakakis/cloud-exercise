services:
  frontend:
    build: ./front-end
    container_name: front-end
    ports:
      - "80:80"
    depends_on:
      - ordersDB
      - productsDB
      - backend
    networks:
      - mynetwork  # Add this line to connect frontend to mynetwork

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    networks:
      - mynetwork
    depends_on:
      - ordersDB
      - productsDB

  ordersDB:
    image: mysql:8
    container_name: orders_db
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: orders
    ports:
      - "3308:3306"
    networks:
      - mynetwork
    volumes:
      - ./mysql-init/orders-init:/docker-entrypoint-initdb.d:ro

  productsDB:
    image: mysql:8
    container_name: products_db
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: products
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init/products-init:/docker-entrypoint-initdb.d:ro
    networks:
      - mynetwork  # Ensure each service is connected to mynetwork

networks:
  mynetwork:
    driver: bridge
